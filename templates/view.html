<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش سطرها</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='view.css') }}">
    <style>
        .result-container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 1.5rem;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .highlight-row {
            background: #e7f3ff;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1a 1a 1a;
        }
        .ellipsis-row {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 0.5rem;
            margin: 0.5rem 0;
        }
        .item-row {
            padding: 0.6rem 1rem;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 0.4rem;
            transition: background 0.2s;
        }
        .item-row:hover {
            background: #e9ecef;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #007bff;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="result-container">
            <div class="highlight-row">
                از: <strong>{{ names[0] }}</strong>
            </div>
            <div class="highlight-row">
                تا: <strong>{{ names[-1] }}</strong>
            </div>

            {% if names|length > 2 %}
                <div class="ellipsis-row">... ({{ names|length - 2 }} مورد دیگر)</div>
            {% endif %}

            {% for name in names %}
                <div class="item-row">
                    {{ name }}
                </div>
            {% endfor %}

            <a href="{{ url_for('index') }}" class="back-link">← بازگشت به فرم</a>
        </div>
    </div>
</body>
</html>
